name: .NET

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout nyaimagetool
        uses: actions/checkout@v4

      - name: Checkout NyaFs
        uses: actions/checkout@v4
        with:
          repository: teplofizik/nyafs
          # main for main, develop for develop/PRs into develop
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          path: nyafs-src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK
        run: dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Pack local NyaFs
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'local.nuget'
          New-Item -ItemType Directory -Path $feed -Force | Out-Null
          dotnet pack nyafs-src/src/NyaFs/NyaFs.csproj -c Release -o $feed
          dotnet nuget add source $feed --name local-nyafs
          Get-ChildItem $feed

      - name: Restore
        run: dotnet restore NyaImageTool.sln

      - name: Build
        run: dotnet build NyaImageTool.sln -c Release --no-restore

      - name: Test
        run: dotnet test NyaImageTool.sln -c Release --no-build --verbosity normal

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.binlog
            **/*.log
          if-no-files-found: ignore
