schema: 1
format: nand
# Раздел с FIT-контейнером: ядро из файла, ramdisk собирается из каталога.
# DTB можно добавить отдельной нодой (kind: devtree).
options: { page: 2048, oob: 0, block: 131072, blocks: 2048 }
children:
  - name: boot
    offset: 0x2200000
    size: auto
    kind: container
    format: fit
    children:
      - { name: kernel, kind: kernel, content: { file: inputs/Image } }
      - { name: ramdisk, kind: filesystem, format: cpio, content: { dir: inputs/rootfs } }
